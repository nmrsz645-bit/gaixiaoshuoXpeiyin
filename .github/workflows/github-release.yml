name: Build domestic OSS release package

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: cmd /c run_tests.bat
      - name: Build domestic release archives
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          python tools/build_github_release.py --version $version --output release
      - name: Arrange OSS upload files
        shell: pwsh
        run: |
          python tools/prepare_domestic_release.py --release release --output oss-upload
      - name: Keep verified OSS upload package
        uses: actions/upload-artifact@v4
        with:
          name: novel-processing-center-oss-${{ github.ref_name }}
          path: oss-upload/updates/novel
