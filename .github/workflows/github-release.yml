name: Build application base for release assembly

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-windows-verified.txt
      - run: cmd /c run_tests.bat
      - name: Build application base (LuxTTS runtime assembled offline)
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          python tools/build_github_release.py --version $version --output release
      - name: Keep application base for complete runtime assembly
        uses: actions/upload-artifact@v4
        with:
          name: novel-processing-center-application-base-${{ github.ref_name }}
          path: release
