name: Build GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: cmd /c run_tests.bat
      - name: Build release archives
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          python tools/build_github_release.py --version $version --output release
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' release/app.zip release/latest.json release/小说处理中心-*-windows-x64.zip --title '${{ github.ref_name }}' --generate-notes
